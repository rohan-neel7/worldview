name: Worldview CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worldview/package-lock.json

      - name: Install dependencies
        working-directory: worldview
        run: npm ci

      - name: Run ESLint
        working-directory: worldview
        run: npm run lint

      - name: Build project
        working-directory: worldview
        run: npm run build
